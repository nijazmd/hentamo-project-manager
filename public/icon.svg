<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hentamoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="#0B0F17" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  <!-- Letter H Icon -->
  <g filter="url(#shadow)">
    <!-- Left bar -->
    <rect x="136" y="128" width="64" height="256" rx="20" fill="url(#hentamoGrad)" />
    <!-- Right bar -->
    <rect x="312" y="128" width="64" height="256" rx="20" fill="url(#hentamoGrad)" />
    <!-- Middle crossbar -->
    <rect x="168" y="228" width="176" height="56" rx="16" fill="url(#hentamoGrad)" />
    <!-- Small accent dot -->
    <circle cx="344" cy="160" r="16" fill="#38BDF8" />
  </g>
</svg>
